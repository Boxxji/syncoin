name: SynCoin
options:
  bundleIdPrefix: org.syncoin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: HX64G9BV5Z
targets:
  SynCoin:
    type: application
    platform: iOS
    sources:
      - SynCoinApp.swift
      - WasmEngine.swift
      - path: wasm3/source
        compilerFlags: ["-Wno-everything"]
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.syncoin.app
      DEVELOPMENT_TEAM: HX64G9BV5Z
      SWIFT_OBJC_BRIDGING_HEADER: SynCoin-Bridging-Header.h
      ENABLE_BITCODE: NO
